services:
  db:
    image: postgres:16-alpine
    container_name: tier3_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: trackerdb
    volumes:
      # 1. Persistent named volume for day-to-day work
      - pgdata:/var/lib/postgresql/data
      # 2. Runs 01-schema.sql then 02-seed.sql automatically on fresh installs
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d trackerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: tier3_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: trackerdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  nginx:
    image: nginx:alpine
    container_name: tier3_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
