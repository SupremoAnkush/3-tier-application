<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3-Tier Task Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; background: #e6f4ea; color: #137333; }
    form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h2>3-Tier Service Task Tracker</h2>
  <p>System Status: <span id="health" class="badge">Checking...</span></p>
  <form id="taskForm">
    <input type="text" id="title" placeholder="Add a new infrastructure task..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="taskList"></ul>

  <script>
    async function loadData() {
      const healthRes = await fetch('/api/health').then(r => r.json());
      document.getElementById('health').textContent = `${healthRes.status} (DB: ${new Date(healthRes.db_time).toLocaleTimeString()})`;

      const tasks = await fetch('/api/tasks').then(r => r.json());
      document.getElementById('taskList').innerHTML = tasks
        .map(t => `<li><strong>[${t.status}]</strong> ${t.title}</li>`)
        .join('');
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      document.getElementById('title').value = '';
      loadData();
    });

    loadData();
  </script>
</body>
</html>
